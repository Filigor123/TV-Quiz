<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Quiz</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;padding:28px;background:#101522;color:#fff;font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center}
h1{margin:8px 0;color:#9bb3ff;font-size:clamp(28px,4vw,48px)} .sub{color:#c4cee5;font-size:clamp(16px,2vw,23px);text-align:center}
#status{margin:14px 0;color:#b9c9ff;font-size:18px;text-align:center}
#qr{background:#fff;padding:12px;border-radius:14px;min-width:224px;min-height:224px;display:flex;align-items:center;justify-content:center;margin:16px auto}
#qr img{display:block} #room{font-size:14px;color:#aebbd4;text-align:center;word-break:break-all;max-width:850px}
.panel{width:min(100%,1000px);margin-top:24px;background:#1b2740;border-radius:20px;padding:24px}
h2{text-align:center;margin:0 0 18px;color:#dce5ff}
#players{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.player{background:#293957;border-radius:13px;padding:16px;font-size:22px;text-align:center}
.player small{display:block;color:#b9c9df;font-size:14px;margin-top:6px}
#game{display:none;width:min(100%,1000px);margin-top:24px}
.question{font-size:clamp(26px,4vw,46px);text-align:center;margin:24px 0}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.answer{padding:22px;background:#293957;border-radius:14px;text-align:center;font-size:clamp(20px,3vw,30px)}
#scores{margin-top:20px;line-height:1.8;text-align:center;font-size:20px}
@media(max-width:600px){.answers{grid-template-columns:1fr}body{padding:16px}}
</style>
</head>
<body>
<h1>📺 TV QUIZ</h1>
<p class="sub">Отсканируйте QR-код телефоном, введите имя и выберите аватар.</p>
<div id="status">Подключаем игровую комнату…</div>
<div id="qr">Создаём QR-код…</div>
<div id="room"></div>
<section class="panel" id="lobby">
<h2>Игроки в комнате</h2>
<div id="players"><div class="player">Пока никого нет<small>Ждём участников…</small></div></div>
</section>
<section id="game">
<div class="question" id="question"></div>
<div class="answers" id="answers"></div>
<div id="scores"></div>
</section>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const statusEl=document.getElementById('status');
const playersEl=document.getElementById('players');
const qrEl=document.getElementById('qr');
const lobbyEl=document.getElementById('lobby');
const gameEl=document.getElementById('game');
const players=new Map();
let peer=null, gameStarted=false;
const question={text:'Какая планета самая большая в Солнечной системе?',answers:['Земля','Юпитер','Марс','Венера'],correct:1};
function send(conn,data){try{if(conn&&conn.open)conn.send(data)}catch(e){}}
function broadcast(data){connections.forEach(c=>send(c,data))}
const connections=new Set();
function roster(){return [...players.values()].map(p=>({id:p.id,name:p.name,avatar:p.avatar,ready:p.ready,score:p.score,answer:p.answer??null}))}
function sendState(conn){send(conn,{type:'state',players:roster(),gameStarted,question:gameStarted?question:null})}
function updateLobby(){
 const list=roster();
 playersEl.innerHTML=list.length?list.map(p=>'<div class="player">'+p.avatar+' '+escapeHtml(p.name)+'<small>'+(p.ready?'✅ Готов':'⏳ Ещё думает')+'</small></div>').join(''):'<div class="player">Пока никого нет<small>Ждём участников…</small></div>';
 if(!gameStarted)statusEl.textContent=list.length?('Подключено игроков: '+list.length+'. Ждём готовности.'):'Комната открыта. Ждём игроков…';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showGame(){
 lobbyEl.style.display='none';qrEl.style.display='none';document.getElementById('room').style.display='none';gameEl.style.display='block';
 document.getElementById('question').textContent=question.text;
 document.getElementById('answers').innerHTML=question.answers.map((a,i)=>'<div class="answer">'+String.fromCharCode(1040+i)+'. '+a+'</div>').join('');
 updateScores();
}
function updateScores(){
 document.getElementById('scores').innerHTML='<h2>Таблица игроков</h2>'+roster().map(p=>p.avatar+' '+escapeHtml(p.name)+' — '+p.score+' очк.'+(p.answer!==null&&p.answer!==undefined?' · ответ отправлен':'')).join('<br>');
}
function startGame(){
 if(gameStarted)return;
 const list=roster();
 if(!list.length||!list.every(p=>p.ready)){statusEl.textContent='Игра начнётся, когда все игроки нажмут «Готов».';return}
 gameStarted=true;broadcast({type:'game-start',question});showGame();statusEl.textContent='Игра началась!';
}
function handleConnection(conn){
 connections.add(conn);
 conn.on('data',data=>{
  if(!data||!data.type)return;
  if(data.type==='join'){
   players.set(conn.peer,{id:conn.peer,name:String(data.name||'Игрок').slice(0,16),avatar:String(data.avatar||'😎'),ready:false,score:0,answer:null});
   sendState(conn);updateLobby();broadcast({type:'players',players:roster()});
  }
  if(data.type==='ready'&&players.has(conn.peer)){
   players.get(conn.peer).ready=!!data.ready;updateLobby();broadcast({type:'players',players:roster()});
  }
  if(data.type==='start'){startGame()}
  if(data.type==='answer'&&gameStarted&&players.has(conn.peer)){
   const p=players.get(conn.peer);
   if(p.answer===null||p.answer===undefined){p.answer=data.answer;p.score+=(data.answer===question.correct?1:0);updateScores();broadcast({type:'players',players:roster()});}
  }
 });
 conn.on('close',()=>{connections.delete(conn);players.delete(conn.peer);updateLobby();broadcast({type:'players',players:roster()})});
 conn.on('error',()=>{connections.delete(conn);players.delete(conn.peer);updateLobby()});
}
if(!window.Peer){statusEl.textContent='Не загрузилась библиотека связи. Обновите страницу или проверьте интернет.'}
else{
 peer=new Peer();
 peer.on('open',id=>{
  const joinUrl=location.origin+location.pathname.replace(/[^/]*$/,'')+'join.html?host='+encodeURIComponent(id);
  qrEl.innerHTML='';
  if(window.QRCode)new QRCode(qrEl,{text:joinUrl,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});
  else qrEl.textContent='QR-библиотека не загрузилась';
  document.getElementById('room').textContent='Код комнаты: '+id;
  statusEl.textContent='Комната создана. Покажите QR-код игрокам.';
 });
 peer.on('connection',handleConnection);
 peer.on('error',e=>{statusEl.textContent='Ошибка соединения: '+e.type+'. Перезагрузите страницу.'});
}
</script>
</body>
</html>
