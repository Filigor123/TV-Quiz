<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../"><title>TV Quiz — редакторский медиапакет</title>
<style>body{background:#111c30;color:#edf2fa;font:17px system-ui;margin:0;padding:28px;max-width:1250px;margin:auto}h1{font-size:32px}p{color:#b9c7dc}select,button{font:inherit;padding:10px;border-radius:8px;background:#294365;color:white;border:1px solid #57759e}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px}article{background:#1d2d47;padding:20px;border-radius:14px;overflow:hidden}img,video{width:100%;height:230px;object-fit:contain;background:#101826}audio{width:100%}small{color:#b9c7dc}a{color:#a6c9ff}details{margin-top:14px}summary{cursor:pointer}header{position:sticky;top:0;background:#111c30;padding-bottom:16px;z-index:2}#error{color:#ffadad}li{margin:5px 0}</style>
<header><h1>TV Quiz · медиапакет</h1><p>Редакторское превью файлов для задачи #13. Это отдельный просмотр материалов, они ещё не подключены к игре. Ответы открываются вручную. Звук включается только по нажатию.</p><label>Категория <select id="category"><option value="">Все</option></select></label> <label><input type="checkbox" id="prepared" checked> Только готовые файлы</label><p id="stats"></p><p id="error"></p></header><main id="items"></main>
<script>
'use strict';const $=id=>document.getElementById(id);let bank;
function el(tag,text){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;return x}
function render(){const rows=bank.items.filter(x=>(!$('category').value||x.category===$('category').value)&&(!$('prepared').checked||x.media));$('items').replaceChildren();$('stats').textContent=rows.length+' заданий в текущем фильтре. Изображения проверены отдельно; аудио требует оценки на слух. Это небольшой пилот, не полные квизы по 30 вопросов.';
for(const r of rows){const a=el('article');a.append(el('small',r.id+' · '+r.category+' · '+r.status),el('h2',r.prompt));if(r.media){const m=el(r.type==='image'?'img':r.type);m.src=r.media.src;if(r.type==='image'){m.alt='Материал вопроса '+r.id;m.loading='lazy'}else{m.controls=true;m.preload='none';m.addEventListener('play',()=>document.querySelectorAll('audio,video').forEach(other=>{if(other!==m)other.pause()}))}a.append(m)}else a.append(el('p','Файл ещё не подготовлен. '+(r.acquisitionError||r.cutNotes||'')));const d=el('details');d.append(el('summary','Ответ, варианты и источник'),el('p',r.answer));const ul=el('ul');for(const o of r.options)ul.append(el('li',o));d.append(ul,el('p',r.explanation),el('p','Проверка: '+r.editorialStatus),el('p','Использование: '+r.rightsStatus));if(r.sourcePage.startsWith('https://')){const link=el('a','Открыть источник');link.href=r.sourcePage;link.target='_blank';link.rel='noopener noreferrer';d.append(link)}a.append(d);$('items').append(a)}
if(!$('category').value){const a=el('article');a.append(el('h2','Фон и отбивки'),el('p','Собственная процедурная музыка. Не заимствованные песни; прослушивание ещё требуется.'));for(const r of bank.accompaniment){const m=el('audio');m.controls=true;m.preload='none';m.src=r.src;a.append(el('p',r.role),m)}$('items').append(a)}}
fetch('content/media-pack/manifest.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(j=>{bank=j;for(const c of [...new Set(j.items.map(x=>x.category))]){const o=el('option',c);o.value=c;$('category').append(o)}render()}).catch(e=>{$('error').textContent='Не удалось прочитать manifest: '+e.message+'. Запустите HTTP-сервер из корня репозитория.'});$('category').onchange=render;$('prepared').onchange=render;
</script></html>
