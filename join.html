<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Quiz — игрок</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:20px;background:radial-gradient(circle at top,#263d68 0,#101522 55%);color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center}
.card{width:100%;max-width:460px;padding:25px 20px;border:1px solid #354b70;border-radius:24px;background:linear-gradient(160deg,#1d2d49,#151f33);box-shadow:0 18px 50px #0008}
h1{text-align:center;color:#b9caff;margin:0 0 8px;font-size:30px}.subtitle{text-align:center;color:#c5cee2;margin:0 0 24px}
label{display:block;margin:18px 0 9px;font-weight:bold}
input{width:100%;padding:15px;border:2px solid #405273;border-radius:12px;background:#101a2d;color:white;font-size:18px;outline:none}
input:focus{border-color:#8daaff}
.avatars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.avatar{-webkit-appearance:none;appearance:none;touch-action:manipulation;min-height:108px;border:2px solid #405273;border-radius:16px;background:linear-gradient(155deg,#344c73,#202e48);font-size:39px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#fff;transition:transform .12s,border-color .12s,background .12s}.avatar span{font-size:12px;font-weight:bold;letter-spacing:.2px;color:#dce7ff}
.avatar:active{transform:scale(.94)}
.avatar.selected{border-color:#b9caff;background:linear-gradient(155deg,#526fa5,#354d78);box-shadow:0 0 0 3px #9bb3ff55;transform:scale(1.04)}
.avatar.local-avatar{background:#684344;border-color:#8a5a59}.avatar.local-avatar:nth-child(3n+2){background:#3b6572}.avatar.local-avatar:nth-child(3n){background:#514d76}.avatar.local-avatar:nth-child(4n){background:#774c61}.avatar.local-avatar:nth-child(5n){background:#375a79}.avatar.local-avatar:nth-child(7n){background:#74612f}
.avatar.local-avatar.selected{border-color:#ff785f;box-shadow:0 0 0 3px #ff785f55,0 8px 18px #0002;transform:translateY(-2px) scale(1.03)}
.avatar.local-avatar span{font-size:11px}.extra-avatars{margin-top:14px;color:#c5cee2}.extra-avatars summary{cursor:pointer;text-align:center;padding:8px}.extra-avatars .avatars{margin-top:8px}
.action{width:100%;margin-top:20px;padding:16px;border:0;border-radius:13px;background:linear-gradient(135deg,#779cff,#526fe0);color:white;font-size:20px;font-weight:bold;cursor:pointer;touch-action:manipulation}
.action:disabled{opacity:.55;cursor:wait}
#message{min-height:28px;margin:14px 0 0;text-align:center;color:#d7e1ff;line-height:1.4}
#play{display:none}.question{font-size:25px;line-height:1.3;text-align:center;margin:20px 0}.roundInfo{text-align:center;color:#c5cee2}.phoneTimer{text-align:center;font-size:28px;color:#ffda83;font-weight:bold}.resultBox{text-align:center;font-size:20px;line-height:1.8}
.choices{display:grid;gap:10px}.choice{padding:16px;border:2px solid #405273;border-radius:12px;background:#293957;color:#fff;font-size:19px;text-align:left;cursor:pointer}
.text-answer{display:grid;gap:12px;margin-top:16px}.text-answer[hidden]{display:none}.text-answer input{width:100%;padding:16px;border:2px solid #405273;border-radius:12px;background:#101a2d;color:#fff;font-size:19px}.text-answer button{padding:16px;border:0;border-radius:12px;background:linear-gradient(135deg,#779cff,#526fe0);color:#fff;font-size:19px;font-weight:bold;cursor:pointer;touch-action:manipulation}.wager-option{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid #8a6831;border-radius:12px;background:#3a2d19;color:#ffe5ab}.wager-option[hidden]{display:none}.wager-option input{width:20px;height:20px;margin:1px 0 0;accent-color:#ffc857}
.closest-form{display:grid;gap:10px;margin-top:16px}.closest-form[hidden]{display:none}.closest-form input{width:100%;padding:16px;border:2px solid #405273;border-radius:12px;background:#101a2d;color:#fff;font-size:21px}.closest-form .unit-label{text-align:center;color:#c5cee2}
.choice:disabled{opacity:1}.choice.correct{border-color:#45d483;background:#174d37;color:#d9ffea}.choice.wrong{border-color:#ff6262;background:#54252e;color:#ffe1e1}.hint{text-align:center;color:#c5cee2}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #a9c4ff;outline-offset:3px}
@media(max-width:420px){body{padding:12px}.card{padding:22px 16px;border-radius:16px}.avatars{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.avatar{min-height:92px;font-size:40px;border-radius:16px;padding:7px 4px}.avatar span{font-size:11px}.question{font-size:23px}.choice{font-size:18px}}
</style>
</head>
<body>
<main class="card">
<section id="profile">
<h1>🎮 TV QUIZ</h1><p class="subtitle">Подключение к игре</p>
<label for="playerName">Твоё имя</label>
<input id="playerName" maxlength="16" placeholder="Введи своё имя" autocomplete="nickname">
<label>Выбери аватар</label>
<div class="avatars" id="avatars">
<button class="avatar selected" type="button" data-avatar="🧑‍🚀">🧑‍🚀<span>Космонавт</span></button>
<button class="avatar" type="button" data-avatar="🧙">🧙<span>Маг</span></button>
<button class="avatar" type="button" data-avatar="🥷">🥷<span>Ниндзя</span></button>
<button class="avatar" type="button" data-avatar="🦸">🦸<span>Герой</span></button>
<button class="avatar" type="button" data-avatar="🧛">🧛<span>Вампир</span></button>
<button class="avatar" type="button" data-avatar="🧟">🧟<span>Зомби</span></button>
<button class="avatar" type="button" data-avatar="🤠">🤠<span>Ковбой</span></button>
<button class="avatar" type="button" data-avatar="🧑‍🎤">🧑‍🎤<span>Рокер</span></button>
<button class="avatar" type="button" data-avatar="🧑‍🍳">🧑‍🍳<span>Повар</span></button>
<button class="avatar" type="button" data-avatar="🕵️">🕵️<span>Детектив</span></button>
<button class="avatar" type="button" data-avatar="🧑‍🚒">🧑‍🚒<span>Пожарный</span></button>
<button class="avatar" type="button" data-avatar="👽">👽<span>Пришелец</span></button>
</div>
<details class="extra-avatars"><summary>Дополнительные аватары</summary><div class="avatars">
<button class="avatar local-avatar" type="button" data-avatar="🤡" aria-label="Клоун">🤡<span>Клоун</span></button>
<button class="avatar local-avatar" type="button" data-avatar="🤪" aria-label="Шалун">🤪<span>Шалун</span></button>
<button class="avatar local-avatar" type="button" data-avatar="💩" aria-label="Пиксель">💩<span>Пиксель</span></button>
<button class="avatar local-avatar" type="button" data-avatar="🐸" aria-label="Лягушка">🐸<span>Лягушка</span></button>
<button class="avatar local-avatar" type="button" data-avatar="🐒" aria-label="Обезьяна">🐒<span>Обезьяна</span></button>
<button class="avatar local-avatar" type="button" data-avatar="🐙" aria-label="Осьминог">🐙<span>Осьминог</span></button>
<button class="avatar local-avatar" type="button" data-avatar="👹" aria-label="Огр">👹<span>Огр</span></button>
<button class="avatar local-avatar" type="button" data-avatar="🦷" aria-label="Зуб">🦷<span>Зуб</span></button>
<button class="avatar local-avatar" type="button" data-avatar="🥴" aria-label="Кружится голова">🥴<span>Дурашка</span></button>
<button class="avatar local-avatar" type="button" data-avatar="🦆" aria-label="Утка">🦆<span>Утка</span></button>
<button class="avatar local-avatar" type="button" data-avatar="🤢" aria-label="Зелёный">🤢<span>Зелёный</span></button>
<button class="avatar local-avatar" type="button" data-avatar="🤡" aria-label="Клоун 2">🤡<span>Шутник</span></button>
</div></details>
<button class="action" id="connectBtn">Подключиться</button>
</section>
<section id="lobby" style="display:none">
<h1 id="welcome">Ты в игре!</h1><p class="subtitle" id="connectionState">Соединение установлено</p>
<div id="playerList" class="hint"></div>
<button class="action" id="readyBtn">Готов</button>
<button class="action" id="startBtn" style="display:none">Начать игру</button>
</section>
<section id="roundWait" style="display:none"><h1 id="phoneRoundTitle"></h1><p id="phoneRoundRules"></p><div id="phoneRoundScores"></div><p>Следующий раунд запускается на экране ведущего.</p></section>
<section id="phoneResults" style="display:none"><h1>🏆 Игра завершена</h1><div id="phoneFinalScores"></div><p>Ждём новую игру на экране ведущего.</p></section>
<section id="play">
<h1>Вопрос</h1><p class="roundInfo" id="roundInfo"></p><div class="phoneTimer" id="phoneTimer"></div><div class="question" id="question"></div><label class="wager-option" id="wagerOption" hidden><input id="wagerCheckbox" type="checkbox"><span><strong>Рискую</strong><br>Верный ответ: 2 очка. Ошибка: −1 очко. Ставка доступна один раз за второй раунд.</span></label><div class="choices" id="choices"></div><div class="text-answer" id="textAnswerForm" hidden><label for="freeAnswer">Твой ответ</label><input id="freeAnswer" type="text" maxlength="120" autocomplete="off" aria-label="Твой ответ" placeholder="Напиши ответ своими словами"><button id="sendFreeAnswer" type="button">Отправить ответ</button></div><div class="closest-form" id="closestForm" hidden><label for="closestValue">Твой ответ</label><input id="closestValue" inputmode="decimal" autocomplete="off"><select id="closestUnitChoice" hidden aria-label="Единица ответа"></select><div class="unit-label" id="closestUnitLabel"></div><button class="action" id="submitClosest" type="button">Отправить ответ</button></div><p class="hint" id="answerMessage"></p><p class="hint" id="explanationPhone"></p>
</section>
<p id="message" aria-live="polite"></p>
</main>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="game-model.js"></script>
<script src="peer-id.js"></script>
<script src="relay-transport.js"></script>
<script>
let avatar='😎',peer=null,conn=null,amReady=false,players=[],started=false,answered=false,phoneTimer=null,selectedAnswer=null,localPlayerId='',currentQuestion=null,wagerAvailable=true;
const hostId=new URLSearchParams(location.search).get('host');
const msg=document.getElementById('message');
const connectBtn=document.getElementById('connectBtn');

function setMessage(text){msg.textContent=text}
document.getElementById('avatars').addEventListener('click',event=>{
 const button=event.target.closest('.avatar');
 if(!button)return;
 document.querySelectorAll('.avatar').forEach(x=>x.classList.remove('selected'));
 button.classList.add('selected');
 avatar=button.dataset.avatar;
 setMessage('Выбран персонаж '+avatar);
});
function send(data){if(conn&&conn.open)conn.send(data)}
function renderPlayers(list){
 players=list||[];
 document.getElementById('playerList').innerHTML=players.map(p=>p.avatar+' '+escapeHtml(p.name)+' '+(p.ready?'✅':'⏳')).join('<br>');
 document.getElementById('startBtn').style.display='none';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function startQuestion(data){
 document.getElementById('roundWait').style.display='none';document.getElementById('phoneResults').style.display='none';
 started=true;answered=false;selectedAnswer=null;clearInterval(phoneTimer);document.getElementById('lobby').style.display='none';document.getElementById('profile').style.display='none';document.getElementById('play').style.display='block';
 const q=QuizGameModel.normalizeQuestion(data.question||data);q.answerOpen=data.answerOpen!==false;currentQuestion=q;
 document.getElementById('roundInfo').textContent=q.roundTitle?'Раунд '+(q.roundIndex+1)+' · '+q.roundTitle+' · вопрос '+q.roundQuestionNumber+' из '+q.roundQuestionCount:data.round&&data.total?'Вопрос '+data.round+' из '+data.total:'';
 let left=Number(data.time)||0;document.getElementById('phoneTimer').textContent=data.answerOpen===false?'Слушаем…':left?left+' сек.':'';if(left&&data.answerOpen!==false)phoneTimer=setInterval(()=>{left=Math.max(0,left-1);document.getElementById('phoneTimer').textContent=left+' сек.';if(left===0)clearInterval(phoneTimer)},1000);
 document.getElementById('question').textContent=q.text;
 const closest=q.type==='closest',freeText=q.type==='free-text',choices=document.getElementById('choices'),form=document.getElementById('closestForm'),textForm=document.getElementById('textAnswerForm'),input=document.getElementById('closestValue');
 document.getElementById('wagerCheckbox').checked=false;syncWagerControl();
 document.getElementById('answerMessage').textContent=closest||freeText?'Введи ответ. Он будет скрыт до конца таймера.':'Выбери правильный ответ';document.getElementById('explanationPhone').textContent='';
 form.hidden=!closest;textForm.hidden=!freeText;choices.hidden=closest||freeText;
 if(freeText){const textInput=document.getElementById('freeAnswer'),submitButton=document.getElementById('sendFreeAnswer');textInput.value='';textInput.disabled=data.answerOpen===false;submitButton.disabled=data.answerOpen===false;const submit=()=>{const value=textInput.value.trim();if(answered||!value||!currentQuestion.answerOpen)return;answered=true;selectedAnswer=value;send({type:'answer',answer:value,wager:q.allowWager&&wagerAvailable&&document.getElementById('wagerCheckbox').checked});textInput.disabled=true;submitButton.disabled=true;document.getElementById('wagerCheckbox').disabled=true;document.getElementById('answerMessage').textContent='Ответ принят. Ждём остальных игроков…'};submitButton.onclick=submit;textInput.onkeydown=event=>{if(event.key==='Enter')submit()}}
 else if(closest){input.type=q.answerMode==='date'?'date':'number';input.step='any';input.inputMode='decimal';input.value='';input.disabled=data.answerOpen===false;input.placeholder=q.answerMode==='date'?'ГГГГ-ММ-ДД':'Число';const unitChoice=document.getElementById('closestUnitChoice'),units=q.answerMode==='number'?QuizGameModel.unitOptions(q.unit):[];unitChoice.replaceChildren(...units.map(unit=>{const option=document.createElement('option');option.value=unit;option.textContent=unit;return option}));unitChoice.disabled=false;unitChoice.hidden=units.length<2;document.getElementById('closestUnitLabel').textContent=q.answerMode==='date'?'Укажи дату':(q.unit?'Можно выбрать другую единицу измерения':'Единица не требуется');document.getElementById('submitClosest').disabled=data.answerOpen===false}
 else choices.innerHTML=q.answers.map((a,i)=>'<button class="choice" data-index="'+i+'">'+String.fromCharCode(1040+i)+'. '+escapeHtml(a)+'</button>').join('');
 if(!closest&&!freeText)choices.querySelectorAll('.choice').forEach(b=>{b.disabled=data.answerOpen===false;b.addEventListener('click',()=>{
  if(answered||!currentQuestion.answerOpen)return;answered=true;selectedAnswer=Number(b.dataset.index);send({type:'answer',answer:selectedAnswer,wager:q.allowWager&&wagerAvailable&&document.getElementById('wagerCheckbox').checked});document.getElementById('wagerCheckbox').disabled=true;
  choices.querySelectorAll('.choice').forEach(x=>x.disabled=true);
  document.getElementById('answerMessage').textContent='Ответ принят. Ждём остальных игроков…';
 });});
 if(data.answerOpen===false){document.getElementById('answerMessage').textContent='Слушаем фрагмент на экране ведущего…';if(freeText){document.getElementById('freeAnswer').disabled=true;document.getElementById('sendFreeAnswer').disabled=true}if(closest){document.getElementById('closestValue').disabled=true;document.getElementById('submitClosest').disabled=true}}
}

function showPhoneRound(data){
 clearInterval(phoneTimer);currentQuestion=null;answered=false;
 ['play','lobby','phoneResults'].forEach(id=>document.getElementById(id).style.display='none');
 document.getElementById('roundWait').style.display='block';
 document.getElementById('phoneRoundTitle').textContent='Раунд '+(data.roundIndex+1)+' из '+data.counts.length+' · '+data.title;
 document.getElementById('phoneRoundRules').textContent=data.rules;
 document.getElementById('phoneRoundScores').innerHTML=data.players.map(p=>escapeHtml(p.name)+' — '+p.score+' очков').join('<br>');
}
function syncWagerControl(){const option=document.getElementById('wagerOption'),checkbox=document.getElementById('wagerCheckbox');if(!option||!checkbox)return;option.hidden=!(currentQuestion&&currentQuestion.allowWager&&wagerAvailable);checkbox.disabled=answered||!wagerAvailable||!currentQuestion?.allowWager||!currentQuestion?.answerOpen}
function renderReveal(data){
 clearInterval(phoneTimer);
 if(currentQuestion)currentQuestion.answerOpen=false;
 const input=document.getElementById('freeAnswer'),submit=document.getElementById('sendFreeAnswer'),checkbox=document.getElementById('wagerCheckbox');
 if(input)input.disabled=true;if(submit)submit.disabled=true;if(checkbox)checkbox.disabled=true;
 document.getElementById('wagerOption').hidden=true;
 if(data.skipped){document.querySelectorAll('button.choice').forEach(button=>button.disabled=true);document.getElementById('answerMessage').textContent='Медиа не загрузилось. Вопрос пропущен без очков.';document.getElementById('explanationPhone').textContent='';document.getElementById('phoneTimer').textContent='Раунд завершён';return}
 if(data.closest){document.getElementById('closestValue').disabled=true;document.getElementById('closestUnitChoice').disabled=true;document.getElementById('submitClosest').disabled=true;document.getElementById('answerMessage').textContent=data.winners.includes(localPlayerId)?'🏆 Ты ближе всех! +1 очко':'Ответ раскрыт. Сравни своё число с правильным значением.';document.getElementById('explanationPhone').textContent='Правильное значение: '+data.target;document.getElementById('phoneTimer').textContent='Раунд завершён';return}
 const me=(data.players||[]).find(player=>player.id===localPlayerId),correct=me?.isCorrect===true,risk=me?.wager===true;
 const wagerResult=risk?(correct?' Ставка: +2 очка.':' Ставка: −1 очко.'):(correct?' +1 очко.':'');
 if(data.freeText){document.getElementById('answerMessage').textContent=(correct?'✅ Правильно!':'❌ Не засчитано.')+wagerResult+' Правильный ответ: '+data.answerText;document.getElementById('explanationPhone').textContent=data.explanation||'';document.getElementById('phoneTimer').textContent='Раунд завершён';return}
 document.querySelectorAll('.choice').forEach((button,i)=>{button.disabled=true;if(i===data.correct)button.classList.add('correct');if(i===selectedAnswer&&selectedAnswer!==data.correct)button.classList.add('wrong')});
 document.getElementById('answerMessage').textContent=(correct?'✅ Правильно!':'❌ Неправильно.')+wagerResult+' Правильный ответ: '+data.answerText;document.getElementById('explanationPhone').textContent=data.explanation||'';document.getElementById('phoneTimer').textContent='Раунд завершён';
}
document.getElementById('submitClosest').addEventListener('click',()=>{
 if(answered||!currentQuestion?.answerOpen||currentQuestion.type!=='closest')return;
 const input=document.getElementById('closestValue'),value=input.value.trim();
 const unit=document.getElementById('closestUnitChoice').value||currentQuestion.unit;
 const valid=currentQuestion.answerMode==='date'?QuizGameModel.parseDate(value)!==null:QuizGameModel.parseQuantity(value+' '+(unit||''),currentQuestion.unit)!==null;
 if(!valid){document.getElementById('answerMessage').textContent=currentQuestion.answerMode==='date'?'Укажи существующую дату.':'Проверь число и единицу измерения.';return}
 answered=true;send({type:'answer',value,unit});input.disabled=true;document.getElementById('closestUnitChoice').disabled=true;document.getElementById('submitClosest').disabled=true;document.getElementById('answerMessage').textContent='Ответ принят. Он скрыт до конца таймера.';
});
let connectionAttempt=0,connectionTimeout=null;
function releaseConnection(){
 // Invalidate callbacks before closing: close/error events can fire synchronously.
 connectionAttempt++;clearTimeout(connectionTimeout);connectionTimeout=null;
 const oldConnection=conn,oldPeer=peer;conn=null;peer=null;
 try{if(oldConnection)oldConnection.close()}catch(error){}
 try{if(oldPeer)oldPeer.destroy()}catch(error){}
}
function resetConnect(message){
 releaseConnection();clearInterval(phoneTimer);
 amReady=false;started=false;localPlayerId='';currentQuestion=null;
 document.getElementById('profile').style.display='block';
 document.getElementById('lobby').style.display='none';
 document.getElementById('play').style.display='none';
 document.getElementById('roundWait').style.display='none';
 document.getElementById('phoneResults').style.display='none';
 document.getElementById('readyBtn').textContent='Готов';
 setMessage(message);
 connectBtn.disabled=false;
 connectBtn.textContent='Повторить подключение';
}
function connectionErrorMessage(error){
 const type=error&&error.type;
 if(type==='peer-unavailable')return 'Комната уже закрыта или её код изменился. Открой квиз на экране ведущего и отсканируй новый QR-код.';
 if(type==='browser-incompatible')return 'Этот браузер не поддерживает игровое соединение. Открой ссылку в обычном Chrome или Safari, а не внутри сканера QR.';
 if(type==='network'||type==='server-error'||type==='socket-error'||type==='socket-closed')return 'Не удалось связаться со службой подключения. Проверь интернет и повтори попытку.';
 if(type==='webrtc'||type==='negotiation-failed')return 'Не удалось установить прямое соединение с ведущим. Проверь, что устройства в обычной, не гостевой сети, а VPN не мешает связи.';
 return 'Ошибка подключения'+(type?' ('+type+')':'')+'. Повтори попытку.';
}
connectBtn.addEventListener('click',()=>{
 if(connectBtn.disabled)return;
 try{
  const name=document.getElementById('playerName').value.trim();
  if(!name){setMessage('Сначала введи имя.');return}
  if(!hostId){setMessage('Не найден код комнаты. Вернись к телевизору и отсканируй QR-код ещё раз.');return}
  if(!window.QuizTransport||(!hostId.startsWith('r1-')&&!window.Peer)){setMessage('Не загрузилась библиотека связи. Проверь интернет и обнови страницу.');return}
  releaseConnection();
  const attempt=connectionAttempt;
  const active=()=>attempt===connectionAttempt;
  const fail=message=>{if(active())resetConnect(message)};
  const waitFor=(duration,message)=>{clearTimeout(connectionTimeout);connectionTimeout=setTimeout(()=>fail(message),duration)};
  connectBtn.disabled=true;
  connectBtn.textContent='Подключаемся…';
  setMessage('Подключаемся к службе связи…');
  peer=QuizTransport.player(hostId);
  const attemptPeer=peer;
  let joined=false;
  waitFor(15000,'Служба связи не ответила. Проверь интернет на телефоне и повтори попытку.');
  attemptPeer.on('open',()=>{
   if(!active())return;
   setMessage('Входим в игровую комнату…');
   waitFor(25000,hostId.startsWith('r1-')?'Сервер комнаты не ответил. Проверь интернет и повтори подключение.':'Не удалось установить прямое соединение с ведущим. Обнови страницу ведущего и отсканируй новый QR-код.');
   conn=attemptPeer.connect(hostId,{reliable:true});
   const attemptConnection=conn;
   attemptConnection.on('open',()=>{
    if(!active())return;
    localPlayerId=attemptPeer.id;
    setMessage('Соединение открыто. Ждём подтверждение входа…');
    waitFor(10000,'Ведущий не подтвердил вход в комнату. Открой квиз заново и отсканируй новый QR-код.');
    try{attemptConnection.send({type:'join',name,avatar})}catch(error){fail(connectionErrorMessage(error))}
   });
   attemptConnection.on('data',data=>{
    if(!active()||!data||typeof data!=='object')return;
    if(data.type==='state'){
     if(!Array.isArray(data.players)||!data.players.some(player=>player.id===localPlayerId))return;
     clearTimeout(connectionTimeout);connectionTimeout=null;joined=true;
     document.getElementById('profile').style.display='none';
     document.getElementById('lobby').style.display='block';
     document.getElementById('welcome').textContent=avatar+' '+name;
     document.getElementById('connectionState').textContent='Ты в комнате. Нажми «Готов».';
     setMessage('');renderPlayers(data.players);
     if(data.gameStarted&&data.question)startQuestion(data.question);
    }
    if(!joined)return;
    if(data.type==='players')renderPlayers(data.players);
    if(data.type==='question')startQuestion(data);
    if(data.type==='round-break')showPhoneRound(data);
    if(data.type==='new-game'){clearInterval(phoneTimer);currentQuestion=null;amReady=false;answered=false;wagerAvailable=true;document.getElementById('readyBtn').textContent='Готов';['play','roundWait','phoneResults'].forEach(id=>document.getElementById(id).style.display='none');document.getElementById('lobby').style.display='block';renderPlayers(data.players);}
    if(data.type==='answer-open'&&currentQuestion){document.querySelectorAll('.choice').forEach(button=>button.disabled=false);currentQuestion.answerOpen=true;document.getElementById('freeAnswer').disabled=false;document.getElementById('sendFreeAnswer').disabled=false;document.getElementById('closestValue').disabled=false;document.getElementById('submitClosest').disabled=false;syncWagerControl();document.getElementById('answerMessage').textContent='Время пошло — отправь ответ.';let left=Number(data.time)||0;clearInterval(phoneTimer);document.getElementById('phoneTimer').textContent=left+' сек.';phoneTimer=setInterval(()=>{left=Math.max(0,left-1);document.getElementById('phoneTimer').textContent=left+' сек.';if(left===0)clearInterval(phoneTimer)},1000)}
    if(data.type==='wager-status'){wagerAvailable=data.available===true;syncWagerControl()}
    if(data.type==='reveal')renderReveal(data);
    if(data.type==='game-over'){clearInterval(phoneTimer);currentQuestion=null;document.getElementById('play').style.display='none';document.getElementById('roundWait').style.display='none';document.getElementById('phoneResults').style.display='block';document.getElementById('phoneFinalScores').innerHTML=data.players.map((p,i)=>(i+1)+'. '+escapeHtml(p.name)+' — '+p.score+' очков').join('<br>');}
   });
   attemptConnection.on('close',()=>fail('Связь с ведущим потеряна. Имя сохранено — можно повторить подключение.'));
   attemptConnection.on('error',error=>fail(connectionErrorMessage(error)));
  });
  attemptPeer.on('error',error=>fail(connectionErrorMessage(error)));
  attemptPeer.on('disconnected',()=>{if(!joined)fail('Связь со службой подключения прервалась. Проверь интернет и повтори попытку.')});
 }catch(error){
  resetConnect('Ошибка на телефоне: '+error.message);
 }
});
document.getElementById('readyBtn').addEventListener('click',()=>{
 amReady=!amReady;document.getElementById('readyBtn').textContent=amReady?'Не готов':'Готов';send({type:'ready',ready:amReady});
});
document.getElementById('startBtn').addEventListener('click',()=>send({type:'start'}));
</script>
</body>
