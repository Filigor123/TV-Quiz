<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Quiz — игрок</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;background:#101522;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center}
.card{width:100%;max-width:460px;padding:25px 20px;border-radius:22px;background:#1b2740;box-shadow:0 18px 50px #0006}
h1{text-align:center;color:#9bb3ff;margin:0 0 8px}.subtitle{text-align:center;color:#c5cee2;margin:0 0 24px}
label{display:block;margin:18px 0 9px;font-weight:bold}
input{width:100%;padding:15px;border:2px solid #405273;border-radius:12px;background:#101a2d;color:white;font-size:18px;outline:none}
input:focus{border-color:#8daaff}.avatars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.avatar{min-height:62px;border:2px solid #405273;border-radius:14px;background:#263653;font-size:32px;cursor:pointer}
.avatar.selected{border-color:#9bb3ff;background:#405d94;box-shadow:0 0 0 2px #9bb3ff55}
.action{width:100%;margin-top:20px;padding:16px;border:0;border-radius:13px;background:#668cff;color:white;font-size:20px;font-weight:bold;cursor:pointer}
.action:disabled{opacity:.45;cursor:not-allowed}
#message{min-height:24px;margin:14px 0 0;text-align:center;color:#c4d1ff}
#play{display:none}.question{font-size:25px;line-height:1.3;text-align:center;margin:20px 0}
.choices{display:grid;gap:10px}.choice{padding:16px;border:2px solid #405273;border-radius:12px;background:#293957;color:#fff;font-size:19px;text-align:left;cursor:pointer}
.choice:disabled{opacity:.55}.hint{text-align:center;color:#c5cee2}
</style>
</head>
<body>
<main class="card">
<section id="profile">
<h1>🎮 TV QUIZ</h1><p class="subtitle">Подключение к игре</p>
<label for="playerName">Твоё имя</label>
<input id="playerName" maxlength="16" placeholder="Введи своё имя" autocomplete="nickname">
<label>Выбери аватар</label>
<div class="avatars" id="avatars">
<button class="avatar selected" type="button">😎</button><button class="avatar" type="button">🤠</button><button class="avatar" type="button">🥸</button><button class="avatar" type="button">🤯</button>
<button class="avatar" type="button">🤡</button><button class="avatar" type="button">🤖</button><button class="avatar" type="button">👽</button><button class="avatar" type="button">👹</button>
<button class="avatar" type="button">😺</button><button class="avatar" type="button">🦊</button><button class="avatar" type="button">🙈</button><button class="avatar" type="button">💀</button>
</div>
<button class="action" id="connectBtn">Подключиться</button>
</section>
<section id="lobby" style="display:none">
<h1 id="welcome">Ты в игре!</h1><p class="subtitle" id="connectionState">Соединение установлено</p>
<div id="playerList" class="hint"></div>
<button class="action" id="readyBtn">Готов</button>
<button class="action" id="startBtn" style="display:none">Начать игру</button>
</section>
<section id="play">
<h1>Вопрос</h1><div class="question" id="question"></div><div class="choices" id="choices"></div><p class="hint" id="answerMessage"></p>
</section>
<p id="message" aria-live="polite"></p>
</main>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
let avatar='😎',peer=null,conn=null,amReady=false,players=[],started=false,answered=false;
const hostId=new URLSearchParams(location.search).get('host');
const msg=document.getElementById('message');
document.querySelectorAll('.avatar').forEach(b=>b.addEventListener('click',()=>{
 document.querySelectorAll('.avatar').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');avatar=b.textContent.trim();
}));
function send(data){if(conn&&conn.open)conn.send(data)}
function renderPlayers(list){
 players=list||[];
 document.getElementById('playerList').innerHTML=players.map(p=>p.avatar+' '+escapeHtml(p.name)+' '+(p.ready?'✅':'⏳')).join('<br>');
 const allReady=players.length>0&&players.every(p=>p.ready);
 document.getElementById('startBtn').style.display=allReady&&!started?'block':'none';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function startQuestion(q){
 started=true;document.getElementById('lobby').style.display='none';document.getElementById('profile').style.display='none';document.getElementById('play').style.display='block';
 document.getElementById('question').textContent=q.text;
 document.getElementById('choices').innerHTML=q.answers.map((a,i)=>'<button class="choice" data-index="'+i+'">'+String.fromCharCode(1040+i)+'. '+a+'</button>').join('');
 document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{
  if(answered)return;answered=true;send({type:'answer',answer:Number(b.dataset.index)});
  document.querySelectorAll('.choice').forEach(x=>x.disabled=true);
  document.getElementById('answerMessage').textContent='Ответ принят. Ждём остальных игроков…';
 }));
}
document.getElementById('connectBtn').addEventListener('click',()=>{
 const name=document.getElementById('playerName').value.trim();
 if(!name){msg.textContent='Сначала введи имя.';return}
 if(!hostId){msg.textContent='В QR-коде нет кода комнаты. Открой страницу, отсканировав QR с телевизора.';return}
 if(!window.Peer){msg.textContent='Не загрузилась связь. Проверь интернет и обнови страницу.';return}
 document.getElementById('connectBtn').disabled=true;msg.textContent='Подключаемся к телевизору…';
 peer=new Peer();
 peer.on('open',()=>{conn=peer.connect(hostId,{reliable:true});conn.on('open',()=>{
  send({type:'join',name,avatar});document.getElementById('profile').style.display='none';document.getElementById('lobby').style.display='block';
  document.getElementById('welcome').textContent=avatar+' '+name;document.getElementById('connectionState').textContent='Подключение установлено';msg.textContent='';
 });conn.on('data',data=>{
  if(data.type==='state'){renderPlayers(data.players);if(data.gameStarted&&data.question)startQuestion(data.question)}
  if(data.type==='players')renderPlayers(data.players);
  if(data.type==='game-start')startQuestion(data.question);
 });conn.on('close',()=>{msg.textContent='Связь с телевизором потеряна. Обнови страницу и подключись снова.'});conn.on('error',()=>{msg.textContent='Не удалось связаться с телевизором.'});
 });
 });
 peer.on('error',e=>{msg.textContent='Ошибка подключения: '+e.type;document.getElementById('connectBtn').disabled=false});
});
document.getElementById('readyBtn').addEventListener('click',()=>{
 amReady=!amReady;document.getElementById('readyBtn').textContent=amReady?'Не готов':'Готов';send({type:'ready',ready:amReady});
});
document.getElementById('startBtn').addEventListener('click',()=>send({type:'start'}));
</script>
</body>
</html>
