<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Quiz — игрок</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:20px;background:radial-gradient(circle at top,#263d68 0,#101522 55%);color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center}
.card{width:100%;max-width:460px;padding:25px 20px;border:1px solid #354b70;border-radius:24px;background:linear-gradient(160deg,#1d2d49,#151f33);box-shadow:0 18px 50px #0008}
h1{text-align:center;color:#b9caff;margin:0 0 8px;font-size:30px}.subtitle{text-align:center;color:#c5cee2;margin:0 0 24px}
label{display:block;margin:18px 0 9px;font-weight:bold}
input{width:100%;padding:15px;border:2px solid #405273;border-radius:12px;background:#101a2d;color:white;font-size:18px;outline:none}
input:focus{border-color:#8daaff}
.avatars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.avatar{-webkit-appearance:none;appearance:none;touch-action:manipulation;min-height:108px;border:2px solid #405273;border-radius:16px;background:linear-gradient(155deg,#344c73,#202e48);font-size:39px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#fff;transition:transform .12s,border-color .12s,background .12s}.avatar span{font-size:12px;font-weight:bold;letter-spacing:.2px;color:#dce7ff}
.avatar:active{transform:scale(.94)}
.avatar.selected{border-color:#b9caff;background:linear-gradient(155deg,#526fa5,#354d78);box-shadow:0 0 0 3px #9bb3ff55;transform:scale(1.04)}
.action{width:100%;margin-top:20px;padding:16px;border:0;border-radius:13px;background:linear-gradient(135deg,#779cff,#526fe0);color:white;font-size:20px;font-weight:bold;cursor:pointer;touch-action:manipulation}
.action:disabled{opacity:.55;cursor:wait}
#message{min-height:28px;margin:14px 0 0;text-align:center;color:#d7e1ff;line-height:1.4}
#play{display:none}.question{font-size:25px;line-height:1.3;text-align:center;margin:20px 0}.roundInfo{text-align:center;color:#c5cee2}.phoneTimer{text-align:center;font-size:28px;color:#ffda83;font-weight:bold}.resultBox{text-align:center;font-size:20px;line-height:1.8}
.choices{display:grid;gap:10px}.choice{padding:16px;border:2px solid #405273;border-radius:12px;background:#293957;color:#fff;font-size:19px;text-align:left;cursor:pointer}
.choice:disabled{opacity:1}.choice.correct{border-color:#45d483;background:#174d37;color:#d9ffea}.choice.wrong{border-color:#ff6262;background:#54252e;color:#ffe1e1}.hint{text-align:center;color:#c5cee2}
</style>
</head>
<body>
<main class="card">
<section id="profile">
<h1>🎮 TV QUIZ</h1><p class="subtitle">Подключение к игре</p>
<label for="playerName">Твоё имя</label>
<input id="playerName" maxlength="16" placeholder="Введи своё имя" autocomplete="nickname">
<label>Выбери аватар</label>
<div class="avatars" id="avatars">
<button class="avatar selected" type="button" data-avatar="🧑‍🚀">🧑‍🚀<span>Космонавт</span></button>
<button class="avatar" type="button" data-avatar="🧙">🧙<span>Маг</span></button>
<button class="avatar" type="button" data-avatar="🥷">🥷<span>Ниндзя</span></button>
<button class="avatar" type="button" data-avatar="🦸">🦸<span>Герой</span></button>
<button class="avatar" type="button" data-avatar="🧛">🧛<span>Вампир</span></button>
<button class="avatar" type="button" data-avatar="🧟">🧟<span>Зомби</span></button>
<button class="avatar" type="button" data-avatar="🤠">🤠<span>Ковбой</span></button>
<button class="avatar" type="button" data-avatar="🧑‍🎤">🧑‍🎤<span>Рокер</span></button>
<button class="avatar" type="button" data-avatar="🧑‍🍳">🧑‍🍳<span>Повар</span></button>
<button class="avatar" type="button" data-avatar="🕵️">🕵️<span>Детектив</span></button>
<button class="avatar" type="button" data-avatar="🧑‍🚒">🧑‍🚒<span>Пожарный</span></button>
<button class="avatar" type="button" data-avatar="👽">👽<span>Пришелец</span></button>
</div>
<button class="action" id="connectBtn">Подключиться</button>
</section>
<section id="lobby" style="display:none">
<h1 id="welcome">Ты в игре!</h1><p class="subtitle" id="connectionState">Соединение установлено</p>
<div id="playerList" class="hint"></div>
<button class="action" id="readyBtn">Готов</button>
<button class="action" id="startBtn" style="display:none">Начать игру</button>
</section>
<section id="play">
<h1>Вопрос</h1><p class="roundInfo" id="roundInfo"></p><div class="phoneTimer" id="phoneTimer"></div><div class="question" id="question"></div><div class="choices" id="choices"></div><p class="hint" id="answerMessage"></p><p class="hint" id="explanationPhone"></p>
</section>
<p id="message" aria-live="polite"></p>
</main>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
let avatar='😎',peer=null,conn=null,amReady=false,players=[],started=false,answered=false,phoneTimer=null,selectedAnswer=null;
const hostId=new URLSearchParams(location.search).get('host');
const msg=document.getElementById('message');
const connectBtn=document.getElementById('connectBtn');

function setMessage(text){msg.textContent=text}
document.getElementById('avatars').addEventListener('click',event=>{
 const button=event.target.closest('.avatar');
 if(!button)return;
 document.querySelectorAll('.avatar').forEach(x=>x.classList.remove('selected'));
 button.classList.add('selected');
 avatar=button.dataset.avatar;
 setMessage('Выбран персонаж '+avatar);
});
function send(data){if(conn&&conn.open)conn.send(data)}
function renderPlayers(list){
 players=list||[];
 document.getElementById('playerList').innerHTML=players.map(p=>p.avatar+' '+escapeHtml(p.name)+' '+(p.ready?'✅':'⏳')).join('<br>');
 document.getElementById('startBtn').style.display='none';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function startQuestion(data){
 started=true;answered=false;selectedAnswer=null;clearInterval(phoneTimer);document.getElementById('lobby').style.display='none';document.getElementById('profile').style.display='none';document.getElementById('play').style.display='block';
 const q=data.question||data;
 document.getElementById('roundInfo').textContent=data.round&&data.total?'Вопрос '+data.round+' из '+data.total:'';
 let left=Number(data.time)||0;document.getElementById('phoneTimer').textContent=left?left+' сек.':'';if(left)phoneTimer=setInterval(()=>{left=Math.max(0,left-1);document.getElementById('phoneTimer').textContent=left+' сек.';if(left===0)clearInterval(phoneTimer)},1000);
 document.getElementById('question').textContent=q.text;
 document.getElementById('answerMessage').textContent='Выбери правильный ответ';document.getElementById('explanationPhone').textContent='';
 document.getElementById('choices').innerHTML=q.answers.map((a,i)=>'<button class="choice" data-index="'+i+'">'+String.fromCharCode(1040+i)+'. '+escapeHtml(a)+'</button>').join('');
 document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{
  if(answered)return;answered=true;selectedAnswer=Number(b.dataset.index);send({type:'answer',answer:selectedAnswer});
  document.querySelectorAll('.choice').forEach(x=>x.disabled=true);
  document.getElementById('answerMessage').textContent='Ответ принят. Ждём остальных игроков…';
 }));
}
function resetConnect(message){
 setMessage(message);
 connectBtn.disabled=false;
 connectBtn.textContent='Повторить подключение';
}
connectBtn.addEventListener('click',()=>{
 try{
  const name=document.getElementById('playerName').value.trim();
  if(!name){setMessage('Сначала введи имя.');return}
  if(!hostId){setMessage('Не найден код комнаты. Вернись к телевизору и отсканируй QR-код ещё раз.');return}
  if(!window.Peer){setMessage('Не загрузилась библиотека связи. Проверь интернет и обнови страницу.');return}
  connectBtn.disabled=true;
  connectBtn.textContent='Подключаемся…';
  setMessage('Создаём соединение с телевизором…');
  peer=new Peer();
  const timeout=setTimeout(()=>{if(!conn||!conn.open){try{peer.destroy()}catch(e){}resetConnect('Телевизор не ответил за 15 секунд. Проверь, что страница с QR-кодом открыта, и попробуй ещё раз.')}},15000);
  peer.on('open',()=>{
   setMessage('Нашли сеть. Соединяемся с телевизором…');
   conn=peer.connect(hostId,{reliable:true});
   conn.on('open',()=>{
    clearTimeout(timeout);
    send({type:'join',name,avatar});
    document.getElementById('profile').style.display='none';
    document.getElementById('lobby').style.display='block';
    document.getElementById('welcome').textContent=avatar+' '+name;
    document.getElementById('connectionState').textContent='Подключение установлено';
    setMessage('');
   });
   conn.on('data',data=>{
    if(data.type==='state'){renderPlayers(data.players);if(data.gameStarted&&data.question)startQuestion({question:data.question})}
    if(data.type==='players')renderPlayers(data.players);
    if(data.type==='question')startQuestion(data);
    if(data.type==='reveal'){clearInterval(phoneTimer);document.querySelectorAll('.choice').forEach((button,i)=>{button.disabled=true;if(i===data.correct)button.classList.add('correct');if(i===selectedAnswer&&selectedAnswer!==data.correct)button.classList.add('wrong')});document.getElementById('answerMessage').textContent=selectedAnswer===data.correct?'✅ Правильно!':'❌ Неправильно. Правильный ответ: '+data.answerText;document.getElementById('explanationPhone').textContent=data.explanation||'';document.getElementById('phoneTimer').textContent='Раунд завершён';}
    if(data.type==='game-over'){clearInterval(phoneTimer);document.getElementById('play').innerHTML='<h1>🏆 Игра завершена</h1><div class="resultBox">'+data.players.map((p,i)=>(i+1)+'. '+escapeHtml(p.name)+' — '+p.score+' очков').join('<br>')+'</div><p class="hint">Спасибо за игру!</p>';}
   });
   conn.on('close',()=>{clearTimeout(timeout);resetConnect('Связь с телевизором потеряна. Обнови страницу и подключись снова.')});
   conn.on('error',()=>{clearTimeout(timeout);resetConnect('Ошибка связи с телевизором. Проверь, что экран TV Quiz всё ещё открыт.')});
  });
  peer.on('error',e=>{clearTimeout(timeout);resetConnect('Ошибка подключения: '+(e.type||'неизвестная ошибка')+'. Попробуй ещё раз.')});
 }catch(error){
  resetConnect('Ошибка на телефоне: '+error.message);
 }
});
document.getElementById('readyBtn').addEventListener('click',()=>{
 amReady=!amReady;document.getElementById('readyBtn').textContent=amReady?'Не готов':'Готов';send({type:'ready',ready:amReady});
});
document.getElementById('startBtn').addEventListener('click',()=>send({type:'start'}));
</script>
</body>
</html>
